spring.application.name=sheild-backend

# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/sheild_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=INFO

# Allowed website origin(s) for CORS (comma separated). Add your Vercel URL when deployed.
sheild.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
